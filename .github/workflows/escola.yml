name: Escola+

on:
  push:
    paths: ["escola/**", ".github/workflows/escola.yml"]
  pull_request:
    paths: ["escola/**", ".github/workflows/escola.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL do backoffice na nuvem embutida no APK (ex.: https://escola.suaescola.com.br/)"
        required: false

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: escola/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: escola/backend/package-lock.json
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: escola/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Gerar APK
        env:
          API_URL: ${{ github.event.inputs.api_url }}
        run: |
          chmod +x gradlew
          if [ -n "$API_URL" ]; then ./gradlew assembleDebug -PapiUrl="$API_URL"; else ./gradlew assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: escola-mais-apk
          path: escola/android/app/build/outputs/apk/debug/*.apk
